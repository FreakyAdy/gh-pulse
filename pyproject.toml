[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-pulse"
version = "0.1.0"
description = "Terminal dashboard for GitHub PRs, CI status, and review requests"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Aditya Suryavanshi"}
]
keywords = ["github", "pr", "dashboard", "cli", "tui", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Terminals",
]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/FreakyAdy/gh-pulse"
Repository = "https://github.com/FreakyAdy/gh-pulse"
Issues = "https://github.com/FreakyAdy/gh-pulse/issues"

[project.scripts]
gh-pulse = "gh_pulse.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not use `asyncio.run` in module scope (tests do this)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/gh_pulse"]